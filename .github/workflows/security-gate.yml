name: Security Gate

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
      expected_head_sha:
        required: true
        type: string
      comparison_base_sha:
        required: true
        type: string
      tested_sha:
        required: true
        type: string
      trusted_ref:
        required: true
        type: string

permissions: {}

concurrency:
  group: security-gate-pr-${{ inputs.pr_number }}-${{ inputs.expected_head_sha }}
  cancel-in-progress: true

jobs:
  verify-merge-result:
    name: Verify frozen merge result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Revalidate exact PR and merge parents
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          COMPARISON_BASE_SHA: ${{ inputs.comparison_base_sha }}
          TESTED_SHA: ${{ inputs.tested_sha }}
        with:
          script: |
            const shaPattern = /^[0-9a-f]{40}$/i;
            for (const [name, value] of Object.entries({
              expected_head_sha: process.env.EXPECTED_HEAD_SHA,
              comparison_base_sha: process.env.COMPARISON_BASE_SHA,
              tested_sha: process.env.TESTED_SHA,
            })) {
              if (!shaPattern.test(value)) {
                throw new Error(`${name} must be a full commit SHA`);
              }
            }
            const pullNumber = Number.parseInt(process.env.PR_NUMBER, 10);
            const { data: pull } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pullNumber,
            });
            if (
              pull.state !== 'open' ||
              pull.draft ||
              pull.head.sha !== process.env.EXPECTED_HEAD_SHA
            ) {
              throw new Error('Pull request changed before the security scan');
            }
            const mergeRef = await github.rest.git.getRef({
              ...context.repo,
              ref: `pull/${pullNumber}/merge`,
            });
            if (mergeRef.data.object?.sha !== process.env.TESTED_SHA) {
              throw new Error('GitHub merge result changed before the security scan');
            }
            const mergeCommit = await github.rest.git.getCommit({
              ...context.repo,
              commit_sha: process.env.TESTED_SHA,
            });
            const parents = mergeCommit.data.parents?.map((parent) => parent.sha) || [];
            if (
              parents.length !== 2 ||
              parents[0] !== process.env.COMPARISON_BASE_SHA ||
              parents[1] !== process.env.EXPECTED_HEAD_SHA
            ) {
              throw new Error('Merge-result parents do not match the authorized base/head');
            }

  high-confidence-secret-scan:
    name: Block credentials and new network access
    needs: verify-merge-result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out exact trusted scanner
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.trusted_ref }}
          path: trusted-security
          persist-credentials: false
          sparse-checkout: scripts/ci

      - name: Check out exact merge result for diff fallback
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tested_sha }}
          path: security-candidate
          fetch-depth: 2
          persist-credentials: false

      - name: Scan added lines for credentials and network access
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          COMPARISON_BASE_SHA: ${{ inputs.comparison_base_sha }}
          TESTED_SHA: ${{ inputs.tested_sha }}
          DIFF_REPOSITORY: ${{ github.workspace }}/security-candidate
        run: python3 trusted-security/scripts/ci/scan_pr_security.py --mode block

  codeql-analysis:
    name: CodeQL (${{ matrix.language }})
    needs: verify-merge-result
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, c-cpp]
    steps:
      - name: Check out exact merge result without credentials
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tested_sha }}
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyze exact merge result
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          ref: refs/pull/${{ inputs.pr_number }}/merge
          sha: ${{ inputs.tested_sha }}

  security-warnings:
    name: Warn on risky constructs
    needs: verify-merge-result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out exact trusted scanner
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.trusted_ref }}
          path: trusted-security
          persist-credentials: false
          sparse-checkout: scripts/ci

      - name: Check out exact merge result for diff fallback
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tested_sha }}
          path: security-candidate
          fetch-depth: 2
          persist-credentials: false

      - name: Report non-blocking findings
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          COMPARISON_BASE_SHA: ${{ inputs.comparison_base_sha }}
          TESTED_SHA: ${{ inputs.tested_sha }}
          DIFF_REPOSITORY: ${{ github.workspace }}/security-candidate
        run: python3 trusted-security/scripts/ci/scan_pr_security.py --mode warn
