# ──────────────────────────────────────────────────────────────
# triton-anchor  Minimum CI
# ──────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main, develop, triton_v3.6]
  pull_request:
    branches: [main, develop, triton_v3.6]

# 同一分支上新的推送自动取消旧的运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── 全局环境变量 ──────────────────────────────────────────────
env:
  PYTHON_VERSION: "3.10"

jobs:
  # ───────────────────────── Job 1: Lint ──────────────────────
  lint:
    name: "Lint & Style"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Pull requests must lint the event head, never GitHub's synthetic merge SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: false          # 不拉取 triton submodule

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install lint tools
        run: pip install 'ruff==0.15.22' 'tomli==2.2.1'

      - name: Run deterministic T6.3 Ruff release gates
        env:
          PRODUCTION_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          T63_RUFF_EVIDENCE_DIR: ${{ runner.temp }}/t63-ruff-evidence
        run: bash scripts/run_t63_ruff_gates.sh

      - name: Upload Ruff gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t63-ruff-evidence
          path: ${{ runner.temp }}/t63-ruff-evidence
          if-no-files-found: error

  # ───────────── Job 2: Pure-Python unit tests ────────────────
  unit-test:
    name: "Unit Tests (pure Python)"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Run pure-Python unit tests
        run: |
          pytest python/triton_anchor/tests/ \
            -v \
            --tb=short \
            --cov=python/triton_anchor \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml
        env:
          PYTHONPATH: python

      - name: Upload coverage artifact
        if: matrix.python-version == '3.10'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ────────────── Job 3: Full build (C++ / CMake) ─────────────
