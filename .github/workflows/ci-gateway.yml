name: CI Gateway
run-name: >-
  ${{ inputs.mode == 'publish' && 'Dashboard | 发布页面' || format('{0} | receive {1}', inputs.run_title || (inputs.task_id && format('Task {0}', inputs.task_id)) || 'Local CI result', inputs.receiver_round) }}
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [receive, publish]
        default: receive
      task_id: {type: string, default: ''}
      receiver_round: {type: choice, options: ['1', '2', '3'], default: '1'}
      run_title: {type: string, default: '', description: 'Display identity passed between stages; normally leave empty'}
permissions: {}
concurrency:
  group: ${{ format('local-ci-receive-{0}', inputs.task_id) }}
  cancel-in-progress: false
jobs:
  receive:
    name: Receive local CI result
    if: >-
      github.repository == 'RACE-org/triton-anchor' &&
      github.event_name == 'workflow_dispatch' && inputs.mode == 'receive'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions: {contents: read, pull-requests: read, checks: read, statuses: write, actions: write}
    outputs:
      state: ${{ steps.wait.outputs.receiver_state }}
      control_sha: ${{ steps.control.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      GITEE_USERNAME: ${{ vars.GITEE_USERNAME || 'likehupochuan' }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_RESULTS_REPO_URL: ${{ vars.GITEE_RESULTS_REPO_URL || 'https://gitee.com/race-org/triton-anchor-local-ci-results.git' }}
      RECEIVER_TASK_ID: ${{ inputs.task_id }}
      RECEIVER_ROUND: ${{ inputs.receiver_round }}
    steps:
      - name: Resolve CI_dev control revision
        id: control
        uses: actions/github-script@v7
        with:
          script: |
            const {data: branch} = await github.rest.repos.getBranch({...context.repo, branch: 'CI_dev'});
            core.setOutput('sha', branch.commit.sha);
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.control.outputs.sha }}
          persist-credentials: false
          submodules: false
      - name: Wait for this task or continue within the round limit
        id: wait
        run: python3 scripts/ci/gateway.py receive
  publish:
    name: Publish CI results
    needs: receive
    if: >-
      !cancelled() &&
      github.repository == 'RACE-org/triton-anchor' &&
      (inputs.mode == 'publish' || needs.receive.outputs.state == 'ready' || needs.receive.outputs.state == 'obsolete')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: local-ci-publish
      cancel-in-progress: false
    outputs:
      dashboard_changed: ${{ steps.dashboard.outputs.changed }}
    permissions: {contents: read, pull-requests: write, statuses: write, checks: write, actions: write, pages: read}
    env:
      GH_TOKEN: ${{ github.token }}
      GITEE_USERNAME: ${{ vars.GITEE_USERNAME || 'likehupochuan' }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_RESULTS_REPO_URL: ${{ vars.GITEE_RESULTS_REPO_URL || 'https://gitee.com/race-org/triton-anchor-local-ci-results.git' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.mode == 'publish' && 'CI_dev' || needs.receive.outputs.control_sha }}
          persist-credentials: false
          submodules: false
      - name: Prepare business dashboard
        run: |
          mkdir -p _site
          cp -R dashboard/. _site/
      - name: Collect dashboard data
        id: collect
        env:
          # An obsolete receiver may CAS-close only its own pending Summary.
          RECEIVER_TASK_ID: ${{ inputs.mode == 'receive' && (needs.receive.outputs.state == 'ready' || needs.receive.outputs.state == 'obsolete') && inputs.task_id || '' }}
          # A manual publish may repair a current task whose receiver was cancelled after its result arrived.
          RECONCILE_PENDING_RESULTS: ${{ inputs.mode == 'publish' && 'true' || 'false' }}
        run: python3 scripts/ci/gateway.py collect
      - name: Check whether dashboard content changed
        id: dashboard
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const next = JSON.parse(fs.readFileSync('_site/data/tasks.json', 'utf8'));
            const files = (directory = '') => fs.readdirSync('_site/' + directory, {withFileTypes: true}).flatMap(entry => {
              const path = directory + entry.name;
              return entry.isDirectory() ? files(path + '/') : path === 'data/tasks.json' ? [] : [path];
            });
            const digest = require('crypto').createHash('sha256');
            for (const path of files().sort()) {
              const bytes = fs.readFileSync('_site/' + path);
              digest.update(JSON.stringify([path, bytes.length]) + '\n').update(bytes);
            }
            next.site_digest = digest.digest('hex');
            fs.writeFileSync('_site/data/tasks.json', JSON.stringify(next, null, 2) + '\n');
            let previous;
            try {
              const {data: page} = await github.rest.repos.getPages(context.repo);
              const url = new URL('data/tasks.json', page.html_url);
              url.searchParams.set('run', context.runId);
              const response = await fetch(url, {headers: {'Cache-Control': 'no-cache'}});
              if (response.status !== 404) {
                if (!response.ok) throw new Error('Cannot read the published dashboard: HTTP ' + response.status);
                previous = await response.json();
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const content = data => JSON.stringify({schema: data?.schema, tasks: data?.tasks, site_digest: data?.site_digest});
            core.setOutput('changed', content(previous) !== content(next));
      - uses: actions/upload-pages-artifact@v3
        if: steps.dashboard.outputs.changed == 'true'
        with: {path: _site}
      - name: Surface incomplete receiver operations
        if: >-
          steps.collect.outputs.receiver_errors != '0' &&
          (inputs.mode == 'publish' ||
           (inputs.mode == 'receive' &&
            (needs.receive.outputs.state == 'ready' || needs.receive.outputs.state == 'obsolete')))
        run: exit 1
      - name: Retry incomplete publication within the receiver round limit
        if: >-
          failure() && inputs.mode == 'receive' && inputs.receiver_round != '3' &&
          (needs.receive.outputs.state == 'ready' || needs.receive.outputs.state == 'obsolete')
        uses: actions/github-script@v7
        env:
          TASK_ID: ${{ inputs.task_id }}
          RECEIVER_ROUND: ${{ inputs.receiver_round }}
          RUN_TITLE: ${{ inputs.run_title }}
        with:
          retries: 3
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo, workflow_id: 'ci-gateway.yml', ref: 'main',
              inputs: {
                mode: 'receive', task_id: process.env.TASK_ID,
                receiver_round: String(Number(process.env.RECEIVER_ROUND) + 1),
                run_title: process.env.RUN_TITLE
              }
            });
  deploy-dashboard:
    name: Deploy dashboard (independent of test results)
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.publish.outputs.dashboard_changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: local-ci-dashboard
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions: {pages: write, id-token: write}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
