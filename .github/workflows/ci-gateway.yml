name: CI Gateway
run-name: >-
  ${{ inputs.run_title || (inputs.pr_number != '' && inputs.pr_number != '0' && format('PR #{0}', inputs.pr_number)) || format('Branch {0}', inputs.source_branch || github.ref_name) }} | dispatch
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [run]
        default: run
      pr_number: {type: string, default: '0'}
      source_branch: {type: string, default: ''}
      requested_sha: {type: string, default: ''}
      request_id: {type: string, default: '', description: 'CI Request run and attempt; leave empty for direct dispatch'}
      trigger_id: {type: string, default: '', description: 'Internal verification trigger; leave empty for manual dispatch'}
      worker_revision_sha: {type: string, default: ''}
      action: {type: string, default: ''}
      full: {type: boolean, default: false}
      run_title: {type: string, default: '', description: 'Display identity passed between stages; normally leave empty'}
permissions: {}
concurrency:
  group: ${{ format('local-ci-run-{0}{1}', inputs.pr_number != '0' && inputs.pr_number || inputs.source_branch || github.ref_name, github.run_attempt > 1 && format('-rerun-{0}', github.run_id) || '') }}
  cancel-in-progress: true
jobs:
  cancel-obsolete:
    name: Cancel obsolete tasks
    needs: validate-worker
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: write, statuses: write, checks: write, actions: read}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.worker_revision_sha }}
          persist-credentials: false
          submodules: false
      - name: Notify local workers about obsolete tasks
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          GITEE_USERNAME: ${{ vars.GITEE_USERNAME || 'likehupochuan' }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_RESULTS_REPO_URL: ${{ vars.GITEE_RESULTS_REPO_URL }}
        run: python3 scripts/ci/gateway.py cancel
  prepare:
    name: >-
      Prepare exact task / ${{ inputs.pr_number != '' && inputs.pr_number != '0' && format('PR #{0}', inputs.pr_number) || format('Branch {0}', inputs.source_branch || github.ref_name) }}
    needs: cancel-obsolete
    if: ${{ github.run_attempt == 1 && inputs.action != 'closed' && inputs.action != 'converted_to_draft' }}
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: write, statuses: write, checks: write, actions: read}
    outputs:
      task_id: ${{ steps.task.outputs.task_id }}
      task_digest: ${{ steps.task.outputs.task_digest }}
      tested_sha: ${{ steps.task.outputs.tested_sha }}
      head_sha: ${{ steps.task.outputs.head_sha }}
      base_sha: ${{ steps.task.outputs.base_sha }}
      external_fork: ${{ steps.task.outputs.external_fork }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.worker_revision_sha }}
          persist-credentials: false
          submodules: false
      - name: Freeze exact task and base/candidate environments
        id: task
        env:
          GH_TOKEN: ${{ github.token }}
          WORKER_SHA: ${{ inputs.worker_revision_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          REQUESTED_SHA: ${{ inputs.requested_sha }}
          LOCAL_CI_REQUEST_ID: ${{ inputs.request_id }}
          LOCAL_CI_TRIGGER_ID: ${{ inputs.trigger_id }}
          LOCAL_CI_ACTION: ${{ inputs.action }}
          FULL: ${{ inputs.full }}
          GITEE_SUBMODULE_MIRRORS: ${{ vars.GITEE_SUBMODULE_MIRRORS || '{}' }}
          EVENT_KIND: ${{ inputs.action == 'manual' && 'manual' || 'push' }}
        run: python3 scripts/ci/gateway.py prepare
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.task.outputs.task_id != '' }}
        with: {name: 'local-ci-task-${{ steps.task.outputs.task_digest }}', path: task.json}
      - name: Validate required PR information
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/gateway.py info
  basic:
    name: Basic CI
    needs: prepare
    if: ${{ github.run_attempt == 1 }}
    permissions: {contents: read}
    uses: ./.github/workflows/basic-checks.yml
    with:
      tested_sha: ${{ needs.prepare.outputs.tested_sha }}
  api:
    name: API compatibility
    needs: [prepare, basic]
    if: ${{ github.run_attempt == 1 }}
    permissions: {contents: read}
    uses: ./.github/workflows/api-compatibility.yml
    with:
      task_digest: ${{ needs.prepare.outputs.task_digest }}
      tested_sha: ${{ needs.prepare.outputs.tested_sha }}
      base_sha: ${{ needs.prepare.outputs.base_sha }}
      worker_revision_sha: ${{ inputs.worker_revision_sha }}
  security:
    name: Security gate
    needs: [prepare, api]
    if: ${{ github.run_attempt == 1 }}
    permissions: {contents: read, security-events: write}
    uses: ./.github/workflows/security.yml
    with:
      task_digest: ${{ needs.prepare.outputs.task_digest }}
      tested_sha: ${{ needs.prepare.outputs.tested_sha }}
      worker_revision_sha: ${{ inputs.worker_revision_sha }}
  basic-result:
    name: Publish Basic CI result
    needs: [prepare, basic]
    if: ${{ always() && github.run_attempt == 1 && needs.prepare.outputs.task_id != '' }}
    permissions: {contents: read, pull-requests: read, checks: write, statuses: write, actions: read}
    uses: ./.github/workflows/preflight-result.yml
    with:
      task_digest: ${{ needs.prepare.outputs.task_digest }}
      worker_revision_sha: ${{ inputs.worker_revision_sha }}
      stage: basic
      outcome: ${{ needs.basic.result }}
  api-result:
    name: Publish API result
    needs: [prepare, api]
    if: ${{ always() && github.run_attempt == 1 && needs.prepare.outputs.task_id != '' }}
    permissions: {contents: read, pull-requests: read, checks: write, statuses: write, actions: read}
    uses: ./.github/workflows/preflight-result.yml
    with:
      task_digest: ${{ needs.prepare.outputs.task_digest }}
      worker_revision_sha: ${{ inputs.worker_revision_sha }}
      stage: api
      outcome: ${{ needs.api.result }}
  security-result:
    name: Publish security result
    # Keep security execution independent, but publish its result/card only
    # after the earlier result publishers have settled.
    needs: [prepare, security, basic-result, api-result]
    if: ${{ always() && github.run_attempt == 1 && needs.prepare.outputs.task_id != '' }}
    permissions: {contents: read, pull-requests: write, checks: write, statuses: write, actions: read}
    uses: ./.github/workflows/preflight-result.yml
    with:
      task_digest: ${{ needs.prepare.outputs.task_digest }}
      worker_revision_sha: ${{ inputs.worker_revision_sha }}
      stage: security
      outcome: ${{ needs.security.result }}
      external_fork: ${{ needs.prepare.outputs.external_fork == 'true' }}
      review_card: ${{ needs.prepare.outputs.external_fork == 'true' && needs.basic-result.result == 'success' && needs.api-result.result == 'success' }}
  approve-external-fork:
    name: Approve external fork
    needs: [prepare, security-result]
    if: ${{ github.run_attempt == 1 && needs.prepare.outputs.external_fork == 'true' && needs.security-result.outputs.eligible == 'true' }}
    environment: local-ci-fork-approval
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: read, actions: read, checks: write, statuses: write}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.worker_revision_sha }}
          persist-credentials: false
          submodules: false
      - uses: actions/download-artifact@v4
        with: {name: 'local-ci-task-${{ needs.prepare.outputs.task_digest }}'}
      - name: Verify required reviewers and the approved PR revision
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TASK_DIGEST: ${{ needs.prepare.outputs.task_digest }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REQUESTED_SHA: ${{ needs.prepare.outputs.head_sha }}
        run: python3 scripts/ci/gateway.py approval
  enqueue:
    name: Dispatch local CI task
    needs: [prepare, basic, api, security, basic-result, api-result, security-result, approve-external-fork]
    if: >-
      always() && github.run_attempt == 1 && needs.prepare.result == 'success' &&
      needs.prepare.outputs.task_id != '' &&
      needs.basic.result == 'success' && needs.api.result == 'success' &&
      needs.security.result == 'success' &&
      needs.basic-result.result == 'success' && needs.api-result.result == 'success' &&
      needs.security-result.result == 'success' &&
      (needs.prepare.outputs.external_fork != 'true' ||
       (needs.security-result.outputs.eligible == 'true' && needs.approve-external-fork.result == 'success'))
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: write, statuses: write, checks: write, actions: write}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.worker_revision_sha }}
          path: trusted
          persist-credentials: false
          submodules: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tested_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - uses: actions/download-artifact@v4
        with: {name: 'local-ci-task-${{ needs.prepare.outputs.task_digest }}'}
      - name: Revalidate approval and publish code then immutable task
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          REQUESTED_SHA: ${{ needs.prepare.outputs.head_sha }}
          EXPECTED_TASK_DIGEST: ${{ needs.prepare.outputs.task_digest }}
          GH_TOKEN: ${{ github.token }}
          GITEE_USERNAME: ${{ vars.GITEE_USERNAME || 'likehupochuan' }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_RESULTS_REPO_URL: ${{ vars.GITEE_RESULTS_REPO_URL }}
        run: python3 trusted/scripts/ci/gateway.py enqueue
      - name: Start the receiver for this published task
        uses: actions/github-script@v7
        env:
          TASK_ID: ${{ needs.prepare.outputs.task_id }}
        with:
          retries: 3
          script: |
            const task = JSON.parse(require('fs').readFileSync('task.json', 'utf8'));
            const runTitle = task.pr_number
              ? `PR #${task.pr_number} | h:${task.head_sha.slice(0, 7)} m:${task.tested_sha.slice(0, 7)}`
              : `Branch ${task.target_branch} | h:${task.tested_sha.slice(0, 7)}`;
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo, workflow_id: 'ci-gateway.yml', ref: 'main',
              inputs: {mode: 'receive', task_id: process.env.TASK_ID, receiver_round: '1', run_title: runTitle}
            });
  finalize-preflight:
    name: Finish interrupted checks
    needs: [prepare, basic, api, security, basic-result, api-result, security-result, approve-external-fork, enqueue]
    if: ${{ always() && github.run_attempt == 1 && needs.prepare.outputs.task_id != '' && needs.enqueue.result != 'success' }}
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: write, statuses: write, checks: write, actions: read}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.worker_revision_sha }}
          persist-credentials: false
          submodules: false
      - uses: actions/download-artifact@v4
        with: {name: 'local-ci-task-${{ needs.prepare.outputs.task_digest }}'}
      - name: Finish checks after failed or cancelled preflight and dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TASK_DIGEST: ${{ needs.prepare.outputs.task_digest }}
          STAGES: '{"prepare":"${{ needs.prepare.result }}","basic":"${{ needs.basic.result }}","api":"${{ needs.api.result }}","security":"${{ needs.security.result }}","card":"${{ needs.security-result.outputs.card_result }}","approval":"${{ needs.approve-external-fork.result }}","enqueue":"${{ needs.enqueue.result }}"}'
        run: python3 scripts/ci/gateway.py finalize
  finish-request:
    name: Finish interrupted request initialization
    needs: [validate-worker, cancel-obsolete, prepare]
    if: ${{ always() && github.run_attempt == 1 && inputs.request_id != '' && needs.prepare.result != 'success' }}
    runs-on: ubuntu-latest
    permissions: {statuses: write}
    steps:
      - uses: actions/github-script@v7
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          REQUESTED_SHA: ${{ inputs.requested_sha }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const sha = process.env.REQUESTED_SHA;
            const rows = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
              owner, repo, ref: sha, per_page: 100
            });
            const current = rows.find(row => row.context === 'Summary');
            const identity = new URLSearchParams((current?.target_url || '').split('#')[1]);
            if (current?.state !== 'pending' || current.creator?.login !== 'github-actions[bot]' ||
                identity.get('local-ci-request') !== process.env.REQUEST_ID || identity.has('local-ci-task')) return;
            await github.rest.repos.createCommitStatus({
              owner, repo, sha, context: 'Summary', state: 'error',
              description: 'Local CI: Gateway initialization failed or was cancelled; see workflow',
              target_url: `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${context.runId}#local-ci-request=${process.env.REQUEST_ID}`
            });
  validate-worker:
    name: Validate control revision
    if: >-
      github.run_attempt == 1 &&
      github.repository == 'RACE-org/triton-anchor' &&
      github.ref_name == 'CI_dev' &&
      github.event_name == 'workflow_dispatch' && inputs.mode == 'run'
    runs-on: ubuntu-latest
    steps:
      - name: Require the routed trusted worker revision
        env:
          WORKER_SHA: ${{ inputs.worker_revision_sha }}
        run: |
          test "$GITHUB_REF_NAME" = CI_dev
          test "$GITHUB_SHA" = "$WORKER_SHA"
  rerun-verification:
    name: Restart verification
    # Re-run failed jobs keeps successful Prepare outputs. Depend on every job
    # so even a failed-only/single-job rerun reaches this fresh-run handoff.
    needs: [validate-worker, cancel-obsolete, prepare, basic, api, security, basic-result, api-result, security-result, approve-external-fork, enqueue, finalize-preflight, finish-request]
    if: >-
      always() && github.run_attempt > 1 &&
      github.repository == 'RACE-org/triton-anchor' &&
      github.ref_name == 'CI_dev' && github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'run' && inputs.action != 'closed' && inputs.action != 'converted_to_draft'
    runs-on: ubuntu-latest
    permissions: {contents: read, actions: write}
    steps:
      - uses: actions/github-script@v7
        env:
          ORIGINAL_INPUTS: ${{ toJSON(inputs) }}
        with:
          retries: 3
          script: |
            const original = JSON.parse(process.env.ORIGINAL_INPUTS);
            const triggerId = `${context.runId}:${process.env.GITHUB_RUN_ATTEMPT}`;
            const {data: control} = await github.rest.repos.getBranch({
              ...context.repo, branch: 'CI_dev'
            });
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo, workflow_id: 'ci-gateway.yml', ref: 'CI_dev',
              inputs: {
                ...original, request_id: '', trigger_id: triggerId,
                worker_revision_sha: control.commit.sha, full: String(original.full)
              }
            });
            await core.summary.addHeading('New verification requested')
              .addRaw(`Trigger: ${triggerId}. The new run repeats checks and any required approval.\n`)
              .addLink('Open CI Gateway runs', `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/workflows/ci-gateway.yml`)
              .write();
