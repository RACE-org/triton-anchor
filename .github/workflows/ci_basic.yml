# ──────────────────────────────────────────────────────────────
# triton-anchor Basic CI
# ──────────────────────────────────────────────────────────────
name: Basic CI

on:
  push:
  pull_request:

# 同一分支上新的推送自动取消旧的运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── 全局环境变量 ──────────────────────────────────────────────
env:
  PYTHON_VERSION: "3.10"

jobs:
  # ───────────────────────── Job 1: Lint ──────────────────────
  lint:
    name: "Lint & Style"
    runs-on: ubuntu-latest

    env:
      RUFF_CRITICAL_RULES: "E9,F63,F7,F82" #E9语法错误；F63表达式逻辑错误；F7控制结构错误；F82未定义变量名
      RUFF_EXCLUDE: "triton/**"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ruff
        run: pip install "ruff==0.15.22"

      - name: Ruff warnings
        shell: bash
        run: |
          has_warning=false

          if ! ruff check \
            --exclude "$RUFF_EXCLUDE" \
            --ignore "$RUFF_CRITICAL_RULES" \
            --output-format=concise \
            python/ tests/ scripts/local_ci/ \
            scripts/ci/scan_pr_security.py \
            scripts/ci/tests/; then
            has_warning=true
          fi

          if ! ruff format \
            --check \
            --exclude "$RUFF_EXCLUDE" \
            python/ tests/ scripts/local_ci/ \
            scripts/ci/scan_pr_security.py \
            scripts/ci/tests/; then
            has_warning=true
          fi

          if [ "$has_warning" = "true" ]; then
            echo "::warning title=Ruff warning::代码规范问题，详细内容请查看日志。"
          fi

      - name: Ruff critical errors
        run: |
          ruff check \
            --exclude "$RUFF_EXCLUDE" \
            --select "$RUFF_CRITICAL_RULES" \
            --output-format=github \
            python/ tests/ scripts/local_ci/ \
            scripts/ci/scan_pr_security.py \
            scripts/ci/tests/

  # ───────────── Job 2: Pure-Python unit tests ────────────────
  unit-test:
    name: "Unit Tests (pure Python)"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Run pure-Python unit tests
        run: |
          pytest python/triton_anchor/tests/ \
            scripts/ci/tests/ \
            -v \
            --tb=short \
            --cov=python/triton_anchor \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml
        env:
          PYTHONPATH: python:scripts/local_ci

      - name: Upload coverage artifact
        if: matrix.python-version == '3.10'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ────────────── Job 3: Full build (C++ / CMake) ─────────────
