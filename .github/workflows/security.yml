name: Local CI / Security
on:
  workflow_call:
    inputs:
      task_digest: {type: string, required: true}
      tested_sha: {type: string, required: true}
      worker_revision_sha: {type: string, required: true}
permissions: {}
jobs:
  scan:
    name: Security scan
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.worker_revision_sha }}
          path: trusted
          persist-credentials: false
          submodules: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tested_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - uses: actions/download-artifact@v4
        with: {name: 'local-ci-task-${{ inputs.task_digest }}'}
      - name: Scan exact added lines with the trusted scanner
        env:
          EXPECTED_TASK_DIGEST: ${{ inputs.task_digest }}
        run: python3 trusted/scripts/ci/gateway.py security
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: security-evidence, path: security-result.json}
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {contents: read, security-events: write}
    strategy:
      fail-fast: false
      matrix: {language: [python, c-cpp]}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.worker_revision_sha }}
          path: trusted
          persist-credentials: false
          submodules: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tested_sha }}
          path: candidate
          persist-credentials: false
          submodules: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          source-root: candidate
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          output: codeql-results
          category: /language:${{ matrix.language }}
      - name: Block high/critical and error findings
        run: python3 trusted/scripts/ci/gateway.py sarif --source codeql-results
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-${{ matrix.language }}
          path: codeql-results
