name: Dispatch Local CI via Gitee
run-name: "${{ inputs.run_title || format('Push {0} | dispatch', inputs.source_branch || github.ref_name) }}"

on:
  push:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "GitHub branch represented by this local CI task"
        required: false
        default: ""
        type: string
      commit_sha:
        description: "Commit SHA to test; defaults to the branch head"
        required: false
        default: ""
        type: string
      flaggems_mode:
        description: "FlagGems mode for manual dispatch"
        required: false
        default: "sample"
        type: choice
        options: [sample, full]
  workflow_call:
    inputs:
      pr_number:
        required: false
        default: ""
        type: string
      head_sha:
        required: true
        type: string
      comparison_base_sha:
        required: false
        default: ""
        type: string
      tested_sha:
        required: true
        type: string
      worker_revision_sha:
        required: true
        type: string
      base_ref:
        required: false
        default: ""
        type: string
      head_repo:
        required: true
        type: string
      head_ref:
        required: true
        type: string
      target_branch:
        required: true
        type: string
      run_title:
        required: false
        default: ""
        type: string
    secrets:
      GITEE_TOKEN:
        required: true

permissions:
  actions: write
  contents: read
  statuses: write

concurrency:
  group: dispatch-local-ci-${{ inputs.head_ref || inputs.source_branch || github.ref_name }}-${{ inputs.tested_sha || inputs.commit_sha || github.sha }}-${{ inputs.flaggems_mode || 'sample' }}
  cancel-in-progress: true

jobs:
  dispatch-local-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CONTEXT: ${{ vars.LOCAL_CI_CONTEXT || 'local-ci/sophgo-cmodel' }}
      GITEE_CI_OWNER: ${{ vars.GITEE_RESULTS_OWNER || vars.GITEE_OWNER || 'race-org' }}
      GITEE_CI_REPO: ${{ vars.GITEE_RESULTS_REPO || 'triton-anchor-local-ci-results' }}
      GITEE_CI_REPO_URL: ${{ vars.GITEE_RESULTS_REPO_URL }}
      GITEE_CI_WEB_URL: ${{ vars.GITEE_RESULTS_WEB_URL || 'https://gitee.com/race-org/triton-anchor-local-ci-results' }}
      GITEE_USERNAME: ${{ vars.GITEE_USERNAME || 'likehupochuan' }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      RECEIVER_WAIT_SECONDS: ${{ vars.LOCAL_CI_RECEIVER_WAIT_SECONDS || '20400' }}
      RECEIVER_MAX_ATTEMPTS: ${{ vars.LOCAL_CI_RECEIVER_MAX_ATTEMPTS || '6' }}

    steps:
      - name: Resolve frozen task metadata
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
          INPUT_BASE_SHA: ${{ inputs.comparison_base_sha }}
          INPUT_TESTED_SHA: ${{ inputs.tested_sha }}
          INPUT_WORKER_SHA: ${{ inputs.worker_revision_sha }}
          INPUT_BASE_REF: ${{ inputs.base_ref }}
          INPUT_HEAD_REPO: ${{ inputs.head_repo }}
          INPUT_HEAD_REF: ${{ inputs.head_ref }}
          INPUT_TARGET_BRANCH: ${{ inputs.target_branch }}
          EVENT_SHA: ${{ inputs.commit_sha || github.sha }}
          EVENT_SOURCE_BRANCH: ${{ inputs.source_branch || github.ref_name }}
          REQUESTED_FLAGGEMS_MODE: ${{ inputs.flaggems_mode || 'sample' }}
        run: |
          set -euo pipefail

          PR_NUMBER="${INPUT_PR_NUMBER}"
          HEAD_SHA="${INPUT_HEAD_SHA:-${EVENT_SHA}}"
          HEAD_REF="${INPUT_HEAD_REF:-${EVENT_SOURCE_BRANCH}}"
          HEAD_REPO="${INPUT_HEAD_REPO:-${REPOSITORY}}"
          BASE_SHA="${INPUT_BASE_SHA}"
          BASE_REF="${INPUT_BASE_REF}"
          TESTED_SHA="${INPUT_TESTED_SHA:-${EVENT_SHA}}"
          WORKER_REVISION_SHA="${INPUT_WORKER_SHA:-${GITHUB_SHA}}"
          TARGET_BRANCH="${INPUT_TARGET_BRANCH:-${EVENT_SOURCE_BRANCH}}"
          TESTED_REF="refs/heads/${HEAD_REF}"
          TESTED_SHA_KIND="commit"
          flaggems_mode="${REQUESTED_FLAGGEMS_MODE:-sample}"

          case "${flaggems_mode}" in sample|full) ;; *) exit 2 ;; esac

          if [ -n "${PR_NUMBER}" ]; then
            TESTED_REF="refs/pull/${PR_NUMBER}/merge"
            TESTED_SHA_KIND="pr_merge"
            task_ref="ci/pr-${PR_NUMBER}/${HEAD_REF}"
            base_task_ref="ci/base/pr-${PR_NUMBER}/${HEAD_REF}"
            head_task_ref="ci/head/pr-${PR_NUMBER}/${HEAD_REF}"
            metadata_ref="ci/meta/pr-${PR_NUMBER}/${HEAD_REF}"
            fetch_ref="${TESTED_REF}"
            base_fetch_ref="refs/heads/${BASE_REF}"
            head_fetch_ref="refs/pull/${PR_NUMBER}/head"
            context="${CONTEXT}"
          elif [ "${flaggems_mode}" = full ]; then
            task_ref="ci/full/${HEAD_REF}"
            base_task_ref=""; head_task_ref=""; metadata_ref=""
            fetch_ref="refs/heads/${HEAD_REF}"; base_fetch_ref=""; head_fetch_ref=""
            context="${CONTEXT}/full"
          else
            task_ref="ci/push/${HEAD_REF}"
            base_task_ref=""; head_task_ref=""; metadata_ref=""
            fetch_ref="refs/heads/${HEAD_REF}"; base_fetch_ref=""; head_fetch_ref=""
            context="${CONTEXT}"
          fi

          for value in "${HEAD_SHA}" "${TESTED_SHA}" "${WORKER_REVISION_SHA}"; do
            [[ "${value}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid SHA: ${value}"; exit 1; }
          done
          if [ -n "${PR_NUMBER}" ]; then
            [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]] || exit 1
            [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          fi
          git check-ref-format "refs/heads/${task_ref}"

          {
            echo "pr_number=${PR_NUMBER}"
            echo "head_sha=${HEAD_SHA}"
            echo "head_ref=${HEAD_REF}"
            echo "head_repo=${HEAD_REPO}"
            echo "base_sha=${BASE_SHA}"
            echo "base_ref=${BASE_REF}"
            echo "target_branch=${TARGET_BRANCH}"
            echo "tested_sha=${TESTED_SHA}"
            echo "worker_revision_sha=${WORKER_REVISION_SHA}"
            echo "tested_ref=${TESTED_REF}"
            echo "tested_sha_kind=${TESTED_SHA_KIND}"
            echo "source_branch=${HEAD_REF}"
            echo "task_ref=${task_ref}"
            echo "base_task_ref=${base_task_ref}"
            echo "head_task_ref=${head_task_ref}"
            echo "metadata_ref=${metadata_ref}"
            echo "fetch_ref=${fetch_ref}"
            echo "base_fetch_ref=${base_fetch_ref}"
            echo "head_fetch_ref=${head_fetch_ref}"
            echo "flaggems_mode=${flaggems_mode}"
            echo "context=${context}"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "${GITHUB_OUTPUT}"

      - name: Fetch and verify exact task commits
        env:
          TESTED_SHA: ${{ steps.meta.outputs.tested_sha }}
          FETCH_REF: ${{ steps.meta.outputs.fetch_ref }}
          BASE_SHA: ${{ steps.meta.outputs.base_sha }}
          BASE_FETCH_REF: ${{ steps.meta.outputs.base_fetch_ref }}
          HEAD_SHA: ${{ steps.meta.outputs.head_sha }}
          HEAD_FETCH_REF: ${{ steps.meta.outputs.head_fetch_ref }}
          TESTED_SHA_KIND: ${{ steps.meta.outputs.tested_sha_kind }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin "+${FETCH_REF}:refs/local-ci/task"
          [ "$(git rev-parse refs/local-ci/task)" = "${TESTED_SHA}" ]
          if [ -n "${BASE_SHA}" ]; then
            git fetch --no-tags origin "+${BASE_FETCH_REF}:refs/local-ci/base"
            [ "$(git rev-parse refs/local-ci/base)" = "${BASE_SHA}" ]
          fi
          if [ -n "${HEAD_FETCH_REF}" ]; then
            git fetch --no-tags origin "+${HEAD_FETCH_REF}:refs/local-ci/head"
            [ "$(git rev-parse refs/local-ci/head)" = "${HEAD_SHA}" ]
          fi
          if [ "${TESTED_SHA_KIND}" = pr_merge ]; then
            read -r commit parent1 parent2 extra < <(git rev-list --parents -n 1 "${TESTED_SHA}")
            [ -z "${extra:-}" ] && [ "${parent1}" = "${BASE_SHA}" ] && [ "${parent2}" = "${HEAD_SHA}" ]
          fi
          git checkout --detach "${TESTED_SHA}"

      - name: Classify PR execution mode
        id: execution
        if: ${{ steps.meta.outputs.pr_number != '' }}
        env:
          BASE_SHA: ${{ steps.meta.outputs.base_sha }}
          HEAD_SHA: ${{ steps.meta.outputs.head_sha }}
        run: |
          set -euo pipefail
          execution_mode=codex_only
          changed=false
          while IFS= read -r -d '' path; do
            changed=true
            case "${path}" in
              scripts/local_ci/codex_ai/*) execution_mode=full; break ;;
              docs/*|*.md|*.markdown|*.rst) ;;
              *) execution_mode=full; break ;;
            esac
          done < <(git diff --name-only -z --no-renames "${BASE_SHA}...${HEAD_SHA}")
          if [[ "${changed}" != true ]]; then
            execution_mode=full
          fi
          echo "execution_mode=${execution_mode}" >> "${GITHUB_OUTPUT}"

      - name: Push task and metadata refs to Gitee
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ steps.meta.outputs.tested_sha }}
          TESTED_REF: ${{ steps.meta.outputs.tested_ref }}
          TESTED_SHA_KIND: ${{ steps.meta.outputs.tested_sha_kind }}
          WORKER_REVISION_SHA: ${{ steps.meta.outputs.worker_revision_sha }}
          TASK_REF: ${{ steps.meta.outputs.task_ref }}
          BASE_TASK_REF: ${{ steps.meta.outputs.base_task_ref }}
          HEAD_TASK_REF: ${{ steps.meta.outputs.head_task_ref }}
          METADATA_REF: ${{ steps.meta.outputs.metadata_ref }}
          BASE_SHA: ${{ steps.meta.outputs.base_sha }}
          BASE_REF: ${{ steps.meta.outputs.base_ref }}
          HEAD_SHA: ${{ steps.meta.outputs.head_sha }}
          HEAD_REF: ${{ steps.meta.outputs.head_ref }}
          HEAD_REPO: ${{ steps.meta.outputs.head_repo }}
          TARGET_BRANCH: ${{ steps.meta.outputs.target_branch }}
          PR_NUMBER: ${{ steps.meta.outputs.pr_number }}
          CAPTURED_AT: ${{ steps.meta.outputs.started_at }}
          EXECUTION_MODE: ${{ steps.execution.outputs.execution_mode || 'full' }}
        run: |
          set -euo pipefail
          [ -n "${GITEE_TOKEN}" ] || { echo "GITEE_TOKEN is empty"; exit 1; }
          repo_url="${GITEE_CI_REPO_URL:-https://gitee.com/${GITEE_CI_OWNER}/${GITEE_CI_REPO}.git}"
          askpass="${RUNNER_TEMP}/gitee-askpass.sh"
          printf '#!/bin/sh\ncase "$1" in *Username*) printf "%%s\\n" "$GITEE_USERNAME" ;; *) printf "%%s\\n" "$GITEE_TOKEN" ;; esac\n' > "${askpass}"
          chmod 700 "${askpass}"
          export GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0
          git config user.name github-actions
          git config user.email github-actions@github.com
          git remote add gitee-ci "${repo_url}"
          [ -z "${BASE_TASK_REF}" ] || git push --force gitee-ci "refs/local-ci/base:refs/heads/${BASE_TASK_REF}"
          [ -z "${HEAD_TASK_REF}" ] || git push --force gitee-ci "refs/local-ci/head:refs/heads/${HEAD_TASK_REF}"

          if [ -n "${METADATA_REF}" ]; then
            pr_payload="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
            metadata_file="${RUNNER_TEMP}/task-metadata.json"
            jq -n \
              --arg schema triton-anchor-local-ci-task-metadata/v2 \
              --arg event_kind pull_request \
              --arg execution_mode "${EXECUTION_MODE}" \
              --arg task_ref "${TASK_REF}" \
              --arg base_task_ref "${BASE_TASK_REF}" \
              --arg head_task_ref "${HEAD_TASK_REF}" \
              --arg target_sha "${TESTED_SHA}" \
              --arg tested_sha "${TESTED_SHA}" \
              --arg tested_ref "${TESTED_REF}" \
              --arg tested_sha_kind "${TESTED_SHA_KIND}" \
              --arg worker_revision_sha "${WORKER_REVISION_SHA}" \
              --arg base_branch "${BASE_REF}" --arg base_sha "${BASE_SHA}" \
              --arg head_branch "${HEAD_REF}" --arg head_sha "${HEAD_SHA}" \
              --arg head_repo "${HEAD_REPO}" --arg target_branch "${TARGET_BRANCH}" \
              --arg pr_number "${PR_NUMBER}" \
              --arg title "$(jq -r '.title // ""' <<< "${pr_payload}")" \
              --arg description "$(jq -r '.body // ""' <<< "${pr_payload}")" \
              --arg captured_at "${CAPTURED_AT}" \
              '{schema:$schema,event_kind:$event_kind,execution_mode:$execution_mode,task_ref:$task_ref,base_task_ref:$base_task_ref,head_task_ref:$head_task_ref,target_sha:$target_sha,tested_sha:$tested_sha,tested_ref:$tested_ref,tested_sha_kind:$tested_sha_kind,worker_revision_sha:$worker_revision_sha,base_branch:$base_branch,base_sha:$base_sha,head_branch:$head_branch,head_sha:$head_sha,head_repo:$head_repo,target_branch:$target_branch,pr_number:($pr_number|tonumber),title:($title[0:500]),description:($description[0:8000]),title_truncated:(($title|length)>500),description_truncated:(($description|length)>8000),captured_at:$captured_at}' > "${metadata_file}"
            blob="$(git hash-object -w "${metadata_file}")"
            tree="$(printf '100644 blob %s\ttask-metadata.json\n' "${blob}" | git mktree)"
            commit="$(printf 'Local CI metadata for PR #%s\n' "${PR_NUMBER}" | git commit-tree "${tree}")"
            git push --force gitee-ci "${commit}:refs/heads/${METADATA_REF}"
          fi
          git push --force gitee-ci "HEAD:refs/heads/${TASK_REF}"

      - name: Mark Local CI pending
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.meta.outputs.pr_number }}
          STATUS_SHA: ${{ steps.meta.outputs.tested_sha }}
          TASK_REF: ${{ steps.meta.outputs.task_ref }}
          STATUS_CONTEXT: ${{ steps.meta.outputs.context }}
        run: |
          if [ -n "${PR_NUMBER}" ]; then
            description="Merge ${STATUS_SHA:0:12}: queued on Gitee"
          else
            description="local CI task queued on Gitee"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
            -f state=pending -f context="${STATUS_CONTEXT}" \
            -f description="${description}" \
            -f target_url="${GITEE_CI_WEB_URL}/tree/${TASK_REF}"

      - name: Start Gateway receiver continuation
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.meta.outputs.pr_number }}
          HEAD_SHA: ${{ steps.meta.outputs.head_sha }}
          BASE_SHA: ${{ steps.meta.outputs.base_sha }}
          TESTED_SHA: ${{ steps.meta.outputs.tested_sha }}
          WORKER_REVISION_SHA: ${{ steps.meta.outputs.worker_revision_sha }}
          SOURCE_BRANCH: ${{ steps.meta.outputs.source_branch }}
          TARGET_BRANCH: ${{ steps.meta.outputs.target_branch }}
          TASK_REF: ${{ steps.meta.outputs.task_ref }}
          STARTED_AT: ${{ steps.meta.outputs.started_at }}
          STATUS_CONTEXT: ${{ steps.meta.outputs.context }}
        run: |
          if [ -n "${PR_NUMBER}" ]; then
            receiver_title="PR ${PR_NUMBER} | h:${HEAD_SHA:0:7} m:${TESTED_SHA:0:7} | receive 1/${RECEIVER_MAX_ATTEMPTS}"
          else
            receiver_title="Push ${SOURCE_BRANCH} | ${TESTED_SHA:0:7} | receive 1/${RECEIVER_MAX_ATTEMPTS}"
          fi
          gh workflow run ci-gateway.yml --repo "${GITHUB_REPOSITORY}" --ref "${GITHUB_REF_NAME}" \
            -f gateway_contract_version=3 -f mode=receive \
            -f pr_number="${PR_NUMBER}" -f expected_head_sha="${HEAD_SHA}" \
            -f comparison_base_sha="${BASE_SHA}" -f tested_sha="${TESTED_SHA}" \
            -f worker_revision_sha="${WORKER_REVISION_SHA}" \
            -f source_branch="${SOURCE_BRANCH}" -f target_branch="${TARGET_BRANCH}" \
            -f task_ref="${TASK_REF}" -f context="${STATUS_CONTEXT}" \
            -f attempt=1 -f started_at="${STARTED_AT}" \
            -f wait_seconds="${RECEIVER_WAIT_SECONDS}" \
            -f run_title="${receiver_title}"

      - name: Mark dispatch failure
        if: ${{ failure() && steps.meta.outputs.tested_sha != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_SHA: ${{ steps.meta.outputs.tested_sha }}
          STATUS_CONTEXT: ${{ steps.meta.outputs.context || env.CONTEXT }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
            -f state=error -f context="${STATUS_CONTEXT}" \
            -f description="failed to dispatch local CI task"
