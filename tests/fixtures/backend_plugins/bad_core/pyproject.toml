[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triton-anchor-w11-bad-core-backend"
version = "1.0.0"
description = "W11 backend rejected by the Core version gate"
requires-python = ">=3.8"

[project.entry-points."triton.backends"]
w11_bad_core = "w11_bad_core_backend"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
w11_bad_core_backend = ["triton_anchor_backend.json"]
