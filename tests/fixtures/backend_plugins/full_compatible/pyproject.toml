[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triton-anchor-w11-full-compatible-backend"
version = "1.0.0"
description = "W11 backend compatible with every declared full-profile gate"
requires-python = ">=3.8"

[project.entry-points."triton.backends"]
w11_full_compatible = "w11_full_compatible_backend"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
w11_full_compatible_backend = ["triton_anchor_backend.json"]
