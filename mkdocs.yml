site_name: triton-anchor API Reference
site_description: Public Python API reference for triton-anchor
site_url: https://race-org.github.io/triton-anchor/
docs_dir: docs
site_dir: site
exclude_docs: |
  build.md
  compatibility_matrix.md
  custom_backend.md
  upgrade_triton.md
  reference/

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - content.code.copy

  palette:
    - scheme: default
      primary: blue
      accent: cyan

nav:
  - API Reference: index.md

plugins:
  - gen-files:
      scripts:
        - docs/scripts/gen_api_reference.py
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - python
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            show_object_full_path: false
            show_root_members_full_path: true
            show_source: false
            show_category_heading: false
            show_labels: false
            show_bases: false
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            docstring_section_style: table
            summary: false
            members_order: source
            heading_level: 3
            filters:
              - "!^_"
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - toc:
      permalink: true
